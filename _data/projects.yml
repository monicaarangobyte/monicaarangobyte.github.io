- title: Customer Retention Analysis
  description: >
    In this project, I worked as a data analyst for Zuber, a new ride-sharing company launching in Chicago. Using historical trip data from competitors, I explored passenger preferences, identified key demand patterns, and tested a hypothesis regarding the impact of weather conditions on ride frequency. The analysis aims to support data-driven decision-making related to market strategy and demand forecasting.
  link: https://github.com/monicaarangobyte/zuberride
  tools: SQL, Python, Pandas, Matplotlib
  image: /assets/images/barrios.png

- title: Interactive Car Data Explorer
  description: >
    This project is an interactive web application developed with Streamlit, designed to facilitate the visual exploration of a car dataset (car_data).

    The app allows users to load data from a CSV file and easily visualize key information.

    **Main Features:**
    - Preview the dataset to understand its structure.
    - Generate an interactive histogram with a button to analyze the distribution of a variable.
    - Generate an interactive scatter plot with a button to explore the relationship between two variables.
    - Use interactive charts created with Plotly Express, fully integrated into the app.

  link: https://github.com/monicaarangobyte/projectsprint7
  tools: Python, Streamlit, Pandas, Plotly Express
  image: /assets/images/modelo.png
